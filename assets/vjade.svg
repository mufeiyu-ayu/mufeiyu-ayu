<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fffb"/>
      <stop offset="1" stop-color="#e8faf1"/>
    </linearGradient>
    <linearGradient id="gemTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7df3c4"/>
      <stop offset="1" stop-color="#1fbf8f"/>
    </linearGradient>
    <linearGradient id="gemLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ed3a2"/>
      <stop offset="1" stop-color="#0e9a73"/>
    </linearGradient>
    <linearGradient id="gemRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c8a68"/>
      <stop offset="1" stop-color="#056350"/>
    </linearGradient>
    <style>
      .spark { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; }
      .spark2 { animation: pulse 2.6s ease-in-out 1.3s infinite; }
      .shine { animation: sweep 3.5s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
      @keyframes sweep { 0%,100% { opacity: 0 } 50% { opacity: .55 } }
    </style>
  </defs>

  <rect width="512" height="512" rx="48" fill="url(#bg)"/>

  <!-- 玉石切面 -->
  <g>
    <polygon points="256,96 368,176 336,236 176,236 144,176" fill="url(#gemTop)"/>
    <polygon points="144,176 176,236 256,392" fill="url(#gemLeft)"/>
    <polygon points="176,236 336,236 256,392" fill="#12ac82"/>
    <polygon points="368,176 336,236 256,392" fill="url(#gemRight)"/>
    <!-- 高光 -->
    <polygon class="shine" points="256,96 368,176 336,236 176,236 144,176" fill="#ffffff" opacity="0"/>
    <polygon points="256,96 200,176 176,236 144,176" fill="#ffffff" opacity=".18"/>
  </g>

  <!-- 星光 -->
  <g fill="#2ed3a2">
    <path class="spark" d="M404 108 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z"/>
    <path class="spark2" d="M110 300 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" fill="#7df3c4"/>
  </g>

  <text x="256" y="466" text-anchor="middle" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#056350">VJade</text>
</svg>
